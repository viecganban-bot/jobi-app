name: Unified job reprocess queue (ingest and R7)
# 엔진 정리 1차(Lee 2026-11-22): 30분 예약·코드 변경 시 자동 실행·전체 재처리(REPROCESS_ENQUEUE_ALL)를 없앴다.
# 수동 실행만 남는다 — 공고 번호를 넣으면 그 공고만 다시 처리하고, 번호 없이 실행하면(관리자 재처리 요청 API가 이렇게 부름)
# 이미 대기열에 들어 있는 요청만 처리한다. 모든 기존 공고를 한꺼번에 대기열에 넣지 않는다.
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Existing job ID (optional, for explicit replay)'
        required: false
        type: number
permissions:
  contents: read
concurrency:
  group: unified-reprocess
  cancel-in-progress: false
jobs:
  reprocess:
    environment: ops-keys  # S4: 운영 열쇠는 master에서만 받는 환경(브랜치·PR 코드에는 안 줌)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      SUPABASE_URL: https://edhuesdnuxlbcfephutq.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      REPROCESS_JOB_IDS: ${{ inputs.job_id || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install crawler dependencies
        run: pip install -r crawler/requirements.txt
      - name: Reprocess pending source-backed jobs through ingest_job
        working-directory: crawler
        run: python reprocess_queue.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify R7 comparator
        run: node --experimental-strip-types scripts/ocr/ocr-compare.test.mjs
      - name: Recalculate OCR and publish gate
        run: |
          npm i --no-save pg@8
          node --experimental-strip-types scripts/ocr/ocr-check.mjs
      - name: Final publication verification and queue result
        if: success()
        working-directory: crawler
        run: python finalize_reprocess_queue.py
